<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel-Fly - Contact</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="contact-page">
    <header>
      <nav class="nav-holder">
        <div class="nav-content">
          <div class="nav-logo">travel-fly</div>
          <div class="nav-links">
            <a href="index.html">home</a>
            <span class="separator"></span>
            <a href="about.html">about</a>
            <span class="separator"></span>
            <a href="tours.html">tours</a>
            <span class="separator"></span>
            <a href="special-offers.html">special offers</a>
            <span class="separator"></span>
            <a href="#">blog</a>
            <span class="separator"></span>
            <a href="contact.html" class="active">contact</a>
          </div>
        </div>
      </nav>
    </header>

    <main id="app">
      <section class="contact-section">
        <div class="container">
          <h2 class="section-heading">CONTACT US:</h2>

          <div class="contact-columns">
            <div class="contact-left">
              <img
                class="contact-map"
                src="images/Special Offers (1)/c9630e6a0d4eea8424c9e77634f917b5.png"
                alt="Office location map"
              />
              <div class="contact-address">
                <p>
                  travel-fly Inc.<br />
                  8901 Marmora Road,<br />
                  Glasgow, D04 89GR.<br />
                  Freephone:+1 800 559 6580<br />
                  Telephone:+1 800 603 6035<br />
                  FAX:+1 800 889 9898<br />
                  E-mail: mail@travelfly.org
                </p>
              </div>
            </div>

            <div class="contact-right">
              <form class="contact-form" action="#" method="post">
                <div class="form-group">
                  <input type="text" name="name" placeholder="Your name…" />
                </div>
                <div class="form-group">
                  <input
                    type="email"
                    name="email"
                    placeholder="Email Address…"
                  />
                </div>
                <div class="form-group">
                  <input type="text" name="company" placeholder="Company…" />
                </div>
                <div class="form-group">
                  <textarea name="message" placeholder="Message..."></textarea>
                </div>
                <button type="submit" class="contact-submit-btn">
                  SEND MESSAGE
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-logo">travel-fly</div>
          <div class="footer-text">
            <p>Copyright 2019 travel-fly. All rights reserved</p>
          </div>
          <div class="footer-social">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
